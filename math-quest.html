<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математический квест с Хомяком</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #ff8c00;
  font-family: 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  user-select: none;
}
#fireworks { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px;
  font-size: 26px;
  font-weight: bold;
  border-bottom: 2px solid #ff8c00;
  text-shadow: 0 0 10px rgba(255,140,0,.6);
}
#timer.warning { color: #ff3b3b; animation: blink .6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.title { font-size: 40px; margin-top: 18px; text-shadow: 0 0 15px rgba(255,140,0,.8); }
.hamster { font-size: 90px; margin: 8px 0; line-height: 1; }
.speech {
  background: #111;
  border: 2px solid #ff8c00;
  border-radius: 16px;
  padding: 12px 22px;
  font-size: 22px;
  max-width: 660px;
  text-align: center;
  box-shadow: 0 0 20px rgba(255,140,0,.3);
  margin-bottom: 20px;
}
#question {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 26px;
  text-shadow: 0 0 12px rgba(255,140,0,.7);
  padding: 0 16px;
}
.buttons { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
.answer {
  min-width: 130px;
  padding: 16px 24px;
  font-size: 32px;
  font-weight: bold;
  background: #0d0d0d;
  color: #ff8c00;
  border: 3px solid #ff8c00;
  border-radius: 14px;
  cursor: pointer;
  transition: all .15s;
}
.answer:hover:not(:disabled) { background: #2b1600; box-shadow: 0 0 18px rgba(255,140,0,.8); transform: scale(1.06); }
.answer.correct { background: #00c853; color: #000; border-color: #00e676; }
.answer.wrong { background: #d50000; color: #fff; border-color: #ff5252; }
.answer:disabled { cursor: default; }
#status { font-size: 22px; margin-top: 18px; min-height: 28px; font-weight: bold; }
#score { color: #ffa500; }
.overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,.93);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; text-align: center; padding: 20px;
}
.overlay.hidden { display: none; }
.overlayTitle { font-size: 52px; font-weight: bold; text-shadow: 0 0 20px rgba(255,140,0,.9); }
.overlaySub { font-size: 28px; font-weight: bold; color: #ffb300; }
.overlayScore { font-size: 30px; }
.gift { font-size: 120px; cursor: pointer; transition: transform .2s; }
.gift:hover { transform: scale(1.15); }
.gift.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.giftHint { font-size: 22px; color: #ffb300; }
.btn {
  font-size: 26px; font-weight: bold;
  padding: 14px 40px;
  background: #111; color: #ff8c00;
  border: 3px solid #ff8c00; border-radius: 12px;
  cursor: pointer; transition: all .15s;
}
.btn:hover { background: #2b1600; box-shadow: 0 0 18px rgba(255,140,0,.8); }
#startOverlay .btn { font-size: 34px; padding: 20px 56px; }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<div class="header">
  <div>Счёт: <span id="score">0</span> / 7</div>
  <div>Время: <span id="timer">80</span> сек</div>
</div>

<div class="title">Математический квест</div>
<div class="hamster" id="hamster">🐹</div>
<div class="speech" id="speech">Привет! Я Хомяк! Готов решать мои примеры?</div>
<div id="question"></div>
<div class="buttons" id="buttons"></div>
<div id="status"></div>

<div class="overlay" id="startOverlay">
  <div class="overlayTitle">Математический квест 🐹</div>
  <div class="overlaySub">Хомяк задаст 7 заданий: сложение, вычитание, умножение, деление, уравнения и периметр!</div>
  <div class="overlayScore">На всё даётся 80 секунд. Ответь на все верно — получишь подарок!</div>
  <button class="btn" onclick="startGame()">Начать игру</button>
</div>

<div class="overlay hidden" id="resultOverlay">
  <div class="overlayTitle" id="resultTitle"></div>
  <div class="overlaySub" id="resultSub"></div>
  <div class="overlayScore" id="resultScore"></div>
  <div id="giftArea" style="display:none">
    <div class="gift" id="gift">🎁</div>
    <div class="giftHint" id="giftHint">Нажми на подарок!</div>
  </div>
  <button class="btn" onclick="startGame()">Играть ещё раз</button>
</div>

<script>
var rand = function (min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; };
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = rand(0, i);
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function optionsFor(correct) {
  var set = new Set([correct]);
  var guard = 0;
  while (set.size < 3 && guard < 200) {
    guard++;
    var d = correct + rand(-5, 5);
    if (d !== correct && d >= 0) set.add(d);
  }
  return shuffle(Array.from(set));
}
function makeQuestions() {
  var qs = [];
  var a, b, x;
  qs.push((function () { a = rand(3, 48); b = rand(3, 48); return { prompt: 'Сколько будет?', text: a + ' + ' + b, correct: a + b }; })());
  qs.push((function () { b = rand(3, 48); a = b + rand(1, 30); return { prompt: 'Сколько будет?', text: a + ' − ' + b, correct: a - b }; })());
  qs.push((function () { a = rand(2, 9); b = rand(2, 9); return { prompt: 'Сколько будет?', text: a + ' × ' + b, correct: a * b }; })());
  qs.push((function () { b = rand(2, 9); x = rand(2, 9); return { prompt: 'Сколько будет?', text: (b * x) + ' : ' + b, correct: x }; })());
  qs.push((function () { x = rand(2, 20); b = rand(2, 20); return { prompt: 'Реши уравнение: чему равен x?', text: 'x + ' + b + ' = ' + (x + b), correct: x }; })());
  qs.push((function () { a = rand(4, 12); b = rand(4, 12); return { prompt: 'Найди периметр прямоугольника (см):', text: 'стороны ' + a + ' см и ' + b + ' см', correct: 2 * (a + b) }; })());
  qs.push((function () { x = rand(2, 9); b = rand(2, 9); return { prompt: 'Реши уравнение: чему равен x?', text: 'x × ' + b + ' = ' + (x * b), correct: x }; })());
  qs.forEach(function (q) { q.options = optionsFor(q.correct); });
  return qs;
}

var state = { questions: [], index: 0, score: 0, timeLeft: 80, timerId: null };

function startGame() {
  clearInterval(state.timerId);
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('resultOverlay').classList.add('hidden');
  state.questions = makeQuestions();
  state.index = 0;
  state.score = 0;
  state.timeLeft = 80;
  updateScore();
  document.getElementById('timer').textContent = 80;
  document.getElementById('timer').classList.remove('warning');
  setSpeech('Поехали! Решай задания!');
  document.getElementById('hamster').textContent = '🐹';
  document.getElementById('status').textContent = '';
  state.timerId = setInterval(tick, 1000);
  showQuestion();
}

function tick() {
  state.timeLeft--;
  var el = document.getElementById('timer');
  el.textContent = state.timeLeft;
  if (state.timeLeft <= 15) el.classList.add('warning');
  if (state.timeLeft <= 0) {
    clearInterval(state.timerId);
    endGame(false, 'Время вышло!');
  }
}

function setSpeech(t) { document.getElementById('speech').textContent = t; }

function showQuestion() {
  var q = state.questions[state.index];
  document.getElementById('question').textContent = q.prompt + '  ' + q.text;
  var box = document.getElementById('buttons');
  box.innerHTML = '';
  q.options.forEach(function (val) {
    var b = document.createElement('button');
    b.className = 'answer';
    b.textContent = val;
    b.onclick = function () { answer(b, q, val); };
    box.appendChild(b);
  });
  document.getElementById('status').textContent = 'Задание ' + (state.index + 1) + ' из 7';
}

function answer(btn, q, val) {
  var buttons = document.querySelectorAll('.answer');
  buttons.forEach(function (b) { b.disabled = true; });
  var isCorrect = val === q.correct;
  if (isCorrect) {
    state.score++;
    updateScore();
    btn.classList.add('correct');
    document.getElementById('hamster').textContent = '😊';
    setSpeech('Верно! Молодец!');
  } else {
    btn.classList.add('wrong');
    document.getElementById('hamster').textContent = '😮';
    setSpeech('Ой, неверно! Правильный ответ — ' + q.correct + '.');
    buttons.forEach(function (b) {
      if (parseInt(b.textContent, 10) === q.correct) b.classList.add('correct');
    });
  }
  document.getElementById('status').textContent = isCorrect ? 'Верно!' : 'Неверно!';
  setTimeout(function () {
    state.index++;
    if (state.index >= 7) {
      endGame(state.score === 7, null);
    } else {
      document.getElementById('hamster').textContent = '🐹';
      showQuestion();
    }
  }, 800);
}

function updateScore() { document.getElementById('score').textContent = state.score; }

function endGame(win, timeMsg) {
  clearInterval(state.timerId);
  document.getElementById('resultOverlay').classList.remove('hidden');
  document.getElementById('resultTitle').textContent = win ? 'ПОБЕДА!' : 'ПОПРОБУЙ ЕЩЁ';
  document.getElementById('resultSub').textContent = timeMsg || (win ? 'Хомяк гордится тобой!' : 'Ты справишься со второй попытки!');
  document.getElementById('resultScore').textContent = 'Твой счёт: ' + state.score + ' из 7';
  document.getElementById('giftArea').style.display = win ? 'block' : 'none';
  if (win) {
    document.getElementById('gift').textContent = '🎁';
    document.getElementById('gift').classList.remove('shake');
    document.getElementById('giftHint').textContent = 'Нажми на подарок!';
  }
}

function openGift() {
  var gift = document.getElementById('gift');
  gift.classList.add('shake');
  setTimeout(function () {
    gift.classList.remove('shake');
    gift.textContent = '🎉';
    document.getElementById('giftHint').textContent = 'Салют! 🎆';
    launchBurst(gift.getBoundingClientRect().left + gift.offsetWidth / 2, gift.getBoundingClientRect().top + gift.offsetHeight / 2);
    fireworksOn = true;
    setTimeout(function () { fireworksOn = false; }, 8000);
  }, 350);
}
document.getElementById('gift').onclick = openGift;

var cv = document.getElementById('fireworks');
var ctx = cv.getContext('2d');
cv.width = window.innerWidth;
cv.height = window.innerHeight;
window.addEventListener('resize', function () { cv.width = window.innerWidth; cv.height = window.innerHeight; });
var fireworksOn = false;
var particles = [];
var colors = ['#ff8c00', '#ffd500', '#ff3b3b', '#00e676', '#2979ff', '#ff00ff', '#ff9100', '#00e5ff'];

function launchBurst(x, y) {
  var n = 90;
  for (var i = 0; i < n; i++) {
    var ang = Math.random() * Math.PI * 2;
    var sp = Math.random() * 7 + 2;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      decay: Math.random() * 0.015 + 0.008,
      size: Math.random() * 3 + 1.5,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

(function loop() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99;
    p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(function (p) { return p.life > 0; });
  if (fireworksOn && Math.random() < 0.06) {
    launchBurst(Math.random() * cv.width, Math.random() * cv.height * 0.6);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
