<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>JS Diagnostic Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .section { background: white; padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #ddd; }
    h2 { margin-top: 0; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>JS Diagnostic Test</h1>
  <p>If you can see this page with results below, HTML/CSS works. Now testing JavaScript:</p>
  <div id="results"></div>

  <script>
    var results = document.getElementById('results');
    var passCount = 0;
    var failCount = 0;

    function log(name, ok, detail) {
      var div = document.createElement('div');
      div.className = ok ? 'pass' : 'fail';
      div.textContent = (ok ? 'PASS' : 'FAIL') + ': ' + name + (detail ? ' (' + detail + ')' : '');
      results.appendChild(div);
      if (ok) passCount++; else failCount++;
    }

    // Test 1: Basic JS execution
    log('Basic JS execution', true);

    // Test 2: var/const/let
    try {
      var testVar = 1;
      log('var declaration', testVar === 1);
    } catch(e) { log('var declaration', false, e.message); }

    try {
      eval('const testConst = 2');
      log('const declaration (ES6)', true);
    } catch(e) { log('const declaration (ES6)', false, e.message); }

    // Test 3: Arrow functions
    try {
      eval('var testArrow = () => 3');
      log('Arrow functions (ES6)', testArrow() === 3);
    } catch(e) { log('Arrow functions (ES6)', false, e.message); }

    // Test 4: Template literals
    try {
      eval('var testTpl = `hello ${1+2}`');
      log('Template literals (ES6)', testTpl === 'hello 3');
    } catch(e) { log('Template literals (ES6)', false, e.message); }

    // Test 5: addEventListener
    try {
      var btn = document.createElement('button');
      btn.id = 'test-btn-add';
      btn.textContent = 'AddEventListener Test';
      btn.style.background = '#4f46e5';
      btn.style.color = 'white';
      btn.style.border = 'none';
      btn.style.padding = '10px 20px';
      btn.style.borderRadius = '6px';
      btn.style.cursor = 'pointer';
      var clicked = false;
      btn.addEventListener('click', function() { clicked = true; });
      document.body.appendChild(btn);
      btn.click();
      log('addEventListener on created element', clicked);
    } catch(e) { log('addEventListener', false, e.message); }

    // Test 6: getElementById
    try {
      var found = document.getElementById('test-btn-add');
      log('getElementById', found !== null, found ? 'found' : 'null');
    } catch(e) { log('getElementById', false, e.message); }

    // Test 7: querySelectorAll
    try {
      var all = document.querySelectorAll('button');
      log('querySelectorAll', all.length > 0, all.length + ' buttons found');
    } catch(e) { log('querySelectorAll', false, e.message); }

    // Test 8: innerHTML
    try {
      var div = document.createElement('div');
      div.id = 'test-inner';
      div.innerHTML = '<button id="inner-btn">Click me</button>';
      document.body.appendChild(div);
      var innerBtn = document.getElementById('inner-btn');
      log('innerHTML + getElementById', innerBtn !== null);
    } catch(e) { log('innerHTML', false, e.message); }

    // Test 9: Inline onclick
    try {
      var div2 = document.createElement('div');
      div2.innerHTML = '<button id="onclick-btn" onclick="window._onclickFired=true">Inline Onclick Test</button>';
      document.body.appendChild(div2);
      var onclickBtn = document.getElementById('onclick-btn');
      window._onclickFired = false;
      onclickBtn.click();
      log('Inline onclick attribute', window._onclickFired);
    } catch(e) { log('Inline onclick', false, e.message); }

    // Test 10: addEventListener on innerHTML-created element
    try {
      var div3 = document.createElement('div');
      div3.innerHTML = '<button id="addlist-btn">AddEventListener on innerHTML btn</button>';
      document.body.appendChild(div3);
      var addlistBtn = document.getElementById('addlist-btn');
      var fired = false;
      addlistBtn.addEventListener('click', function() { fired = true; });
      addlistBtn.click();
      log('addEventListener on innerHTML-created element', fired);
    } catch(e) { log('addEventListener on innerHTML', false, e.message); }

    // Test 11: document.createElementNS (SVG)
    try {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('width', '100');
      rect.setAttribute('height', '100');
      rect.setAttribute('fill', 'blue');
      svg.appendChild(rect);
      log('SVG createElementNS', svg.firstChild === rect);
    } catch(e) { log('SVG createElementNS', false, e.message); }

    // Test 12: Array.from
    try {
      eval('var arr = Array.from({length:3}, (_,i)=>i)');
      log('Array.from (ES6)', arr.length === 3 && arr[1] === 1);
    } catch(e) { log('Array.from (ES6)', false, e.message); }

    // Test 13: .forEach on NodeList
    try {
      var btns = document.querySelectorAll('button');
      var count = 0;
      btns.forEach(function() { count++; });
      log('NodeList.forEach (ES6)', count === btns.length, count + ' items');
    } catch(e) { log('NodeList.forEach (ES6)', false, e.message); }

    // Summary
    var summary = document.createElement('div');
    summary.className = 'section';
    summary.innerHTML = '<h2>Summary</h2><p class="' + (failCount === 0 ? 'pass' : 'fail') + '">' +
      passCount + ' passed, ' + failCount + ' failed out of ' + (passCount + failCount) + ' tests</p>' +
      '<p>If all tests pass, the browser is fine. The issue is in the main app code, not the browser.</p>';
    results.appendChild(summary);

    console.log('[Diagnostic] ' + passCount + ' passed, ' + failCount + ' failed');
  </script>
</body>
</html>
