<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Studio — векторный редактор</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Верхняя панель ===== -->
<header id="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7b8cff" stroke-width="2"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z"/></svg>
    <span>Vector Studio</span>
  </div>

  <div class="tb-group">
    <button class="tb-btn" id="btnNew" title="Новый документ (Ctrl+N)">Новый</button>
    <button class="tb-btn" id="btnOpen" title="Открыть (Ctrl+O)">Открыть</button>
    <button class="tb-btn primary" id="btnSave" title="Сохранить на сервер (Ctrl+S)">Сохранить</button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button class="tb-btn" id="btnUndo" title="Отменить (Ctrl+Z)">⟲</button>
    <button class="tb-btn" id="btnRedo" title="Повторить (Ctrl+Shift+Z)">⟳</button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button class="tb-btn" id="btnExportSvg" title="Экспорт в SVG">SVG</button>
    <button class="tb-btn" id="btnExportPng" title="Экспорт в PNG">PNG</button>
  </div>

  <div class="tb-spacer"></div>

  <div class="tb-group">
    <label class="tb-check" title="Показать сетку"><input type="checkbox" id="chkGrid" checked> Сетка</label>
    <label class="tb-check" title="Привязка к сетке"><input type="checkbox" id="chkSnap" checked> Привязка</label>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button class="tb-btn" id="btnZoomOut" title="Уменьшить (Ctrl+-)">−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="tb-btn" id="btnZoomIn" title="Увеличить (Ctrl+=)">+</button>
    <button class="tb-btn" id="btnZoomFit" title="По размеру (Ctrl+0)">⤢</button>
  </div>
</header>

<!-- ===== Левая панель инструментов ===== -->
<nav id="toolbar">
  <button class="tool-btn active" data-tool="select" title="Выделение (V)">
    <svg viewBox="0 0 24 24"><path d="M4 3l6 16 2.5-6 6-2.5L4 3z"/></svg>
  </button>
  <button class="tool-btn" data-tool="node" title="Узлы (A)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><path d="M12 6l-6.5 10M12 6l6.5 10M6.5 16h11"/></svg>
  </button>
  <button class="tool-btn" data-tool="pen" title="Перо (P)">
    <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
  </button>
  <button class="tool-btn" data-tool="hand" title="Рука (H, пробел)">
    <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v7"/><path d="M6 13.5V11a2 2 0 0 0-4 0v3a8 8 0 0 0 8 8h2a7 7 0 0 0 5-2l3-3a2 2 0 0 0-3-3l-3 2"/></svg>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" data-tool="rect" title="Прямоугольник (R)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
  </button>
  <button class="tool-btn" data-tool="ellipse" title="Эллипс (E)">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="6"/></svg>
  </button>
  <button class="tool-btn" data-tool="line" title="Линия (L)">
    <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
  </button>
  <button class="tool-btn" data-tool="polygon" title="Многоугольник (O)">
    <svg viewBox="0 0 24 24"><polygon points="12,3 21,8.5 18,18.5 6,18.5 3,8.5"/></svg>
  </button>
  <button class="tool-btn" data-tool="star" title="Звезда (S)">
    <svg viewBox="0 0 24 24"><polygon points="12,2 14.8,9.2 22,9.8 16.5,14.5 18.2,21.8 12,17.5 5.8,21.8 7.5,14.5 2,9.8 9.2,9.2"/></svg>
  </button>
  <button class="tool-btn" data-tool="text" title="Текст (T)">
    <svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></svg>
  </button>
</nav>

<!-- ===== Панель слоёв ===== -->
<aside id="layersPanel">
  <div class="panel-header">
    <span>Слои</span>
    <button id="btnAddLayer" title="Добавить слой">+</button>
  </div>
  <div class="layer-actions">
    <button id="btnToFront" title="На передний план (])">▲</button>
    <button id="btnForward" title="Вперёд">↑</button>
    <button id="btnBackward" title="Назад">↓</button>
    <button id="btnToBack" title="На задний план ([)">▼</button>
    <button id="btnDupLayer" title="Дублировать (Ctrl+D)">⧉</button>
  </div>
  <div id="layersList"></div>
</aside>

<!-- ===== Холст ===== -->
<main id="canvasArea">
  <div id="viewport">
    <div id="world">
      <svg id="artboardSVG"></svg>
      <div id="selectionLayer"></div>
      <div id="nodeLayer"></div>
      <div id="marquee"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="stTool">Выделение</span>
    <span id="stCursor">—</span>
    <span id="stCount"></span>
    <span id="stZoom">100%</span>
  </div>
</main>

<!-- ===== Панель свойств ===== -->
<aside id="propsPanel">
  <div class="panel-header"><span>Свойства</span></div>

  <div class="prop-group" id="grpArtboard">
    <div class="prop-label">Артборд</div>
    <div class="prop-row">
      <label>Ш</label><input type="number" id="abW" min="10" step="10">
      <label>В</label><input type="number" id="abH" min="10" step="10">
    </div>
    <div class="prop-row">
      <label>Фон</label><input type="color" id="abBg"><input type="text" id="abBgHex" class="hex">
    </div>
  </div>

  <div id="grpSelection" style="display:none">

    <div class="prop-group">
      <div class="prop-label">Трансформация</div>
      <div class="prop-row">
        <label>X</label><input type="number" id="pX" step="1">
        <label>Y</label><input type="number" id="pY" step="1">
      </div>
      <div class="prop-row">
        <label>W</label><input type="number" id="pW" step="1">
        <label>H</label><input type="number" id="pH" step="1">
      </div>
      <div class="prop-row">
        <label>Угол</label><input type="number" id="pRot" step="1">
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">Заливка</div>
      <div class="prop-row">
        <input type="color" id="pFill"><input type="text" id="pFillHex" class="hex">
        <button class="mini-btn" id="pFillNone" title="Без заливки">∅</button>
      </div>
      <div class="prop-row">
        <label>Непр.</label><input type="range" id="pFillOp" min="0" max="100" value="100">
        <input type="number" id="pFillOpNum" min="0" max="100" value="100" class="num-sm">
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">Обводка</div>
      <div class="prop-row">
        <input type="color" id="pStroke"><input type="text" id="pStrokeHex" class="hex">
        <button class="mini-btn" id="pStrokeNone" title="Без обводки">∅</button>
      </div>
      <div class="prop-row">
        <label>Толщ.</label><input type="number" id="pStrokeW" min="0" step="0.5" class="num-sm">
      </div>
      <div class="prop-row">
        <label>Непр.</label><input type="range" id="pStrokeOp" min="0" max="100" value="100">
        <input type="number" id="pStrokeOpNum" min="0" max="100" value="100" class="num-sm">
      </div>
      <div class="prop-row">
        <label>Пунктир</label><input type="checkbox" id="pDash">
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">Общее</div>
      <div class="prop-row">
        <label>Непр.</label><input type="range" id="pOpacity" min="0" max="100" value="100">
        <input type="number" id="pOpacityNum" min="0" max="100" value="100" class="num-sm">
      </div>
    </div>

    <div class="prop-group" id="grpShape" style="display:none">
      <div class="prop-label">Форма</div>
      <div class="prop-row" id="rowRadius" style="display:none">
        <label>Радиус</label><input type="number" id="pRadius" min="0" step="1" class="num-sm">
      </div>
      <div class="prop-row" id="rowSides" style="display:none">
        <label>Углы</label><input type="number" id="pSides" min="3" max="24" step="1" class="num-sm">
        <label>Луч</label><input type="number" id="pRatio" min="5" max="100" step="1" class="num-sm">
      </div>
    </div>

    <div class="prop-group" id="grpText" style="display:none">
      <div class="prop-label">Текст</div>
      <div class="prop-row">
        <label>Разм.</label><input type="number" id="pFontSize" min="1" step="1" class="num-sm">
        <select id="pFontFamily">
          <option>Arial</option><option>Arial Black</option><option>Calibri</option>
          <option>Cambria</option><option>Consolas</option><option>Courier New</option>
          <option>Georgia</option><option>Impact</option><option>Segoe UI</option>
          <option>Tahoma</option><option>Times New Roman</option><option>Trebuchet MS</option>
          <option>Verdana</option>
        </select>
      </div>
      <div class="prop-row">
        <select id="pFontWeight">
          <option value="normal">Обычный</option><option value="bold">Жирный</option>
        </select>
        <select id="pAlign">
          <option value="start">◀</option><option value="middle">▶</option><option value="end">◀</option>
        </select>
      </div>
      <textarea id="pText" rows="3" placeholder="Текст…"></textarea>
    </div>

    <div class="prop-group" id="grpPath" style="display:none">
      <div class="prop-label">Контур</div>
      <div class="prop-row">
        <span id="pNodeCount"></span>
        <button class="mini-btn" id="pPathClosed">Замкнуть</button>
      </div>
      <div class="prop-row" id="nodeTools">
        <button class="mini-btn" id="pNodeSmooth" title="Сгладить узел">Сгладить</button>
        <button class="mini-btn" id="pNodeCorner" title="Сделать угловым">Угол</button>
        <button class="mini-btn danger" id="pNodeDelete" title="Удалить узел (Del)">Удалить узел</button>
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-row">
        <button class="mini-btn" id="pDup">Дублировать</button>
        <button class="mini-btn danger" id="pDel">Удалить</button>
      </div>
    </div>
  </div>

  <div id="noSelection">Ничего не выбрано</div>
</aside>

<!-- ===== Модальное окно: открыть ===== -->
<div class="modal-overlay" id="openModal">
  <div class="modal">
    <h3>Открыть проект</h3>
    <div id="openList" class="modal-list"></div>
    <p class="modal-empty" id="openEmpty">Нет сохранённых проектов</p>
    <div class="modal-actions">
      <button class="btn ghost" data-close>Закрыть</button>
    </div>
  </div>
</div>

<!-- ===== Модальное окно: сохранить ===== -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <h3>Сохранить проект</h3>
    <div class="prop-row">
      <label>Имя</label><input type="text" id="saveName">
    </div>
    <div id="saveList" class="modal-list"></div>
    <p class="modal-empty">Нет сохранённых проектов</p>
    <div class="modal-actions">
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn primary" id="saveConfirm">Сохранить</button>
    </div>
  </div>
</div>

<!-- ===== Модальное окно: новый ===== -->
<div class="modal-overlay" id="newModal">
  <div class="modal modal-sm">
    <h3>Новый документ</h3>
    <div class="prop-row"><label>Ширина</label><input type="number" id="newW" value="1200" min="10"></div>
    <div class="prop-row"><label>Высота</label><input type="number" id="newH" value="800" min="10"></div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>Отмена</button>
      <button class="btn primary" id="newConfirm">Создать</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
