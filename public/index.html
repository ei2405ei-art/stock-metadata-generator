<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн Шахматы</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <div id="lobby" class="screen active">
      <div class="container">
        <h1>♔ Шахматы онлайн ♚</h1>
        <div class="name-input">
          <input type="text" id="playerName" placeholder="Ваше имя" maxlength="20" autocomplete="off">
        </div>
        <div class="menu-buttons">
          <button id="createGameBtn" class="btn btn-primary">Создать игру</button>
          <button id="joinGameBtn" class="btn btn-secondary">Присоединиться по коду</button>
        </div>
        <div id="joinPanel" class="join-panel hidden">
          <input type="text" id="roomCode" placeholder="Код комнаты" maxlength="6" autocomplete="off" style="text-transform:uppercase">
          <button id="connectBtn" class="btn btn-primary">Войти</button>
        </div>
        <div id="errorMsg" class="error hidden"></div>
        <div id="waitingRoom" class="hidden">
          <div class="spinner"></div>
          <p>Ожидание соперника...</p>
          <p class="room-code">Код: <strong id="displayRoomCode"></strong></p>
          <p class="hint">Скопируйте код и передайте другу</p>
        </div>
      </div>
    </div>

    <div id="game" class="screen">
      <div class="game-layout">
        <div class="player-bar top" id="topPlayer">
          <span class="player-name" id="opponentName">Соперник</span>
          <span class="player-timer" id="opponentTimer"></span>
        </div>

        <div class="board-container">
          <div class="coordinates coords-left" id="coordsLeft"></div>
          <div id="board" class="chess-board"></div>
          <div class="coordinates coords-bottom" id="coordsBottom"></div>
        </div>

        <div class="player-bar bottom" id="bottomPlayer">
          <span class="player-name" id="playerNameDisplay">Вы</span>
          <span class="turn-indicator" id="turnIndicator"></span>
        </div>

        <div class="side-panel">
          <div id="status" class="status"></div>
          <div id="moveHistory" class="move-history"></div>
          <div class="game-controls">
            <button id="newGameBtn" class="btn btn-secondary">Новая игра</button>
            <button id="leaveBtn" class="btn btn-danger">Выйти</button>
          </div>
        </div>
      </div>
    </div>

    <div id="gameOverModal" class="modal hidden">
      <div class="modal-content">
        <h2 id="gameOverTitle"></h2>
        <p id="gameOverMessage"></p>
        <div class="modal-buttons">
          <button id="rematchBtn" class="btn btn-primary">Реванш</button>
          <button id="backToLobbyBtn" class="btn btn-secondary">В лобби</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chess-utils.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
